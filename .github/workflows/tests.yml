name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs everything listed in DESCRIPTION (Imports/Depends/Suggests),
      # Bioconductor packages included, plus devtools/testthat for running
      # the suite the same way AGENTS.md documents for local development.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::testthat
          needs: check

      - name: Run test suite (same invocation as AGENTS.md)
        run: |
          Rscript -e 'devtools::load_all("."); testthat::test_dir("tests/testthat")'
